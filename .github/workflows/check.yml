name: Verify quiz
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: quiz_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r api/requirements.txt
      - run: python -m pytest tests -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:test-only-password@127.0.0.1:5432/quiz_test
      - run: npm ci
      - run: npm ci
        working-directory: web
      - run: npm run build
      - run: npm test
